<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="50%" stop-color="#5856D6" />
      <stop offset="100%" stop-color="#FF2D55" />
    </linearGradient>
    <linearGradient id="receiptGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <!-- Glass inner border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="6" />
  
  <!-- Receipt shape -->
  <g filter="url(#shadow)">
    <rect x="136" y="96" width="240" height="320" rx="24" fill="url(#receiptGlow)" />
    <!-- Receipt top zig-zag or notch -->
    <path d="M 136 120 Q 150 110 164 120 T 192 120 T 220 120 T 248 120 T 276 120 T 304 120 T 332 120 T 360 120 T 376 120" stroke="#E2E8F0" stroke-width="3" fill="none" />
    
    <!-- Lines representing receipt items -->
    <rect x="168" y="150" width="80" height="14" rx="7" fill="#007AFF" />
    <rect x="300" y="150" width="44" height="14" rx="7" fill="#64748B" />

    <rect x="168" y="186" width="96" height="14" rx="7" fill="#FF2D55" />
    <rect x="300" y="186" width="44" height="14" rx="7" fill="#64748B" />

    <rect x="168" y="222" width="110" height="14" rx="7" fill="#FF9500" />
    <rect x="300" y="222" width="44" height="14" rx="7" fill="#64748B" />

    <!-- Dashed separator line -->
    <line x1="168" y1="265" x2="344" y2="265" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6,6" />

    <!-- Avatars: Ado (blue) & Nikola (pink) -->
    <circle cx="196" cy="320" r="22" fill="#007AFF" />
    <text x="196" y="327" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">A</text>

    <circle cx="256" cy="320" r="14" fill="#FF9500" />
    <text x="256" y="325" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">&amp;</text>

    <circle cx="316" cy="320" r="22" fill="#FF2D55" />
    <text x="316" y="327" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">N</text>

    <rect x="168" y="366" width="176" height="16" rx="8" fill="#10B981" />
  </g>
</svg>
